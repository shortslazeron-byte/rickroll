<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>You've been Rickrolled</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(circle at 50% 25%, #252525, #090909 65%);
      color: #fff; font-family: Arial, Helvetica, sans-serif; text-align: center;
    }
    main { width: min(100%, 760px); }
    h1 { margin: 0 0 10px; font-size: clamp(27px, 6vw, 48px); letter-spacing: .02em; }
    p { color: #bdbdbd; margin: 0 0 22px; }
    .gif-wrap {
      overflow: hidden; border: 1px solid #3b3b3b; border-radius: 16px;
      background: #111; box-shadow: 0 18px 60px #0009;
    }
    img { display: block; width: 100%; height: auto; }
    button {
      margin-top: 22px; border: 0; border-radius: 999px; padding: 15px 25px;
      background: #fff; color: #111; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: transform .15s, background .15s;
    }
    button:hover { transform: scale(1.04); background: #e8e8e8; }
    #player { margin: 22px auto 0; width: min(100%, 560px); }
    #player iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; }
    .hint { margin-top: 14px; font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>YOU'VE BEEN RICKROLLED</h1>
    <p>Кажется, ты ожидал увидеть что-то другое…</p>
    <div class="gif-wrap">
      <img src="dance-moves.gif" alt="Рик Эстли танцует">
    </div>
    <button id="start">▶ Включить музыку</button>
    <div id="player" hidden></div>
    <div class="hint">Нажми на кнопку. Отменить уже нельзя.</div>
  </main>
  <script>
    const button = document.getElementById('start');
    const player = document.getElementById('player');
    button.addEventListener('click', () => {
      player.hidden = false;
      player.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1" title="Never Gonna Give You Up" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
      button.textContent = '♪ Музыка играет';
      button.disabled = true;
      button.style.opacity = '.7';
    });
  </script>
</body>
</html>
